plugins {
	id 'net.fabricmc.fabric-loom' version '1.16.+'
	id 'maven-publish'
	id "com.modrinth.minotaur" version "2.+"
}

base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories{
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.nucleoid.xyz/" }
	maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
	mavenCentral()
}

dependencies {
	//to change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation include("eu.pb4:map-canvas-api:${project.mapcanvas_version}")
	implementation include("eu.pb4:sgui:${project.sgui_version}")
	implementation "me.lucko:fabric-permissions-api:0.7.0"

	[
			"imageio:imageio-core",
			"imageio:imageio-webp",
			"imageio:imageio-metadata",
			"common:common-lang",
			"common:common-io",
			"common:common-image",
	].forEach {
		implementation include("com.twelvemonkeys.${it}:3.15.0")
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		image2map {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	accessWidenerPath = file("src/main/resources/image2map.accesswidener")
}

// Minecraft 26.3 no longer ships TinyFD. Bundle just its bindings and native libraries;
// Minecraft provides the matching LWJGL core. Server code never loads these classes.
dependencies {
	clientImplementation include("org.lwjgl:lwjgl-tinyfd:3.4.3") { transitive = false }
	['natives-windows', 'natives-windows-arm64', 'natives-linux', 'natives-linux-arm64',
	 'natives-macos', 'natives-macos-arm64'].each { platform ->
		clientRuntimeOnly include("org.lwjgl:lwjgl-tinyfd:3.4.3:${platform}") { transitive = false }
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

// Dependency-free regression harness for the security boundary and upload lifecycle.
sourceSets {
	securityTest {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
}
tasks.register('securityTest', JavaExec) {
	dependsOn securityTestClasses
	classpath = sourceSets.securityTest.runtimeClasspath
	mainClass = 'space.essem.image2map.SecurityRegressionTest'
	systemProperty 'java.awt.headless', 'true'
	args layout.buildDirectory.dir('security-test').get().asFile.absolutePath
	workingDir layout.buildDirectory.dir('security-test')
	doFirst { workingDir.mkdirs() }
}
check.dependsOn securityTest

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven
			artifact(jar) {
				builtBy jar
			}
			artifact(sourcesJar) {
				builtBy sourcesJar
			}
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

if (System.getenv("MODRINTH")) {
	modrinth {
		token = System.getenv("MODRINTH")
		projectId = '13RpG7dA'
		versionNumber = "" + version
		versionType = "release"
		changelog = System.getenv("CHANGELOG")
		// On fabric, use 'remapJar' instead of 'jar'
		uploadFile = jar
		gameVersions = [((String) project.minecraft_version)]
		loaders = ["fabric"]
	}

	jar {
		finalizedBy project.tasks.modrinth
	}
}
